<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0e0f11">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Estúdio Matiz</title>
<style>
/* Layout: celular = barra no topo, palco da imagem, painel de ajustes embaixo (controles, abas, ferramentas). Telas largas: painel à direita. */
:root {
  color-scheme: dark;
  --bg: #0e0f11; --panel: #17181b; --panel-2: #212226; --line: #2c2e33;
  --fg: #ecEAE5; --muted: #8d9098; --accent: #6f9bff; --accent-ink: #0a1020; --ring: #fff;
  --ui: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --num: ui-monospace, 'SF Mono', 'Roboto Mono', Menlo, monospace;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; overscroll-behavior: none; }
body { background: var(--bg); color: var(--fg); font: 14px/1.4 var(--ui); display: flex; flex-direction: column; overflow: hidden; padding-inline: 16px; touch-action: manipulation; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.app { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding-block: 8px; }
.bar { display: flex; align-items: center; gap: 4px; }
.brand { margin-right: auto; min-width: 0; display: none; }
.brand b { font-size: 16px; letter-spacing: -.01em; }
.brand small { display: block; color: var(--muted); font-size: 11px; max-width: 30ch; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ib { flex: 1; max-width: 56px; height: 42px; display: grid; place-items: center; background: transparent; border: 0; border-radius: 12px; color: var(--fg); }
.ib:disabled { opacity: .3; }
.ib[aria-pressed="true"] { color: var(--accent); background: var(--panel-2); }
.ib.save { background: var(--accent); color: var(--accent-ink); max-width: 64px; }
label.ib { cursor: pointer; }

.work { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.left { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.stage { touch-action: none; position: relative; flex: 1; min-height: 140px; background: transparent; overflow: hidden; }
.fitbox { position: absolute; inset: 6px 8px; display: grid; place-items: center; }
.wrap { position: relative; background: #060607; border-radius: 10px; box-shadow: 0 0 0 1px var(--line); }
.wrap canvas { border-radius: 10px; position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#ov { touch-action: none; }
#ov.on { cursor: crosshair; }
.zoomreset { position: absolute; right: 10px; bottom: 10px; z-index: 6; height: 30px; padding: 0 12px; border-radius: 15px; border: 1px solid #3a3d44; background: rgba(33,34,38,.9); font: 12px var(--num); }
.chip { position: absolute; left: 8px; padding: 3px 8px; border-radius: 7px; background: rgba(15,16,18,.78); font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; pointer-events: none; z-index: 3; }
.chip.b { top: 8px; } .chip.a { bottom: 8px; }
.chip.f { left: 50%; transform: translateX(-50%); bottom: 10px; font-size: 12px; padding: 5px 12px; background: rgba(40,42,48,.82); }
.split { position: absolute; left: -2px; right: -2px; height: 44px; transform: translateY(-50%); touch-action: none; cursor: ns-resize; z-index: 4; }
.split::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.3); }
.split i { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: rgba(120,140,150,.85); border: 2px solid #fff; }
.vbar { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.vbar button { width: 30px; height: 30px; border: 0; background: none; display: grid; place-items: center; }
.vbar input { flex: 1; min-width: 0; }
.vbar .t { font: 12px var(--num); color: var(--muted); }

.panel .grab { flex: none; height: 30px; width: 100%; border: 0; background: none; display: grid; place-items: center; padding: 0; touch-action: none; cursor: grab; }
.panel .grab i { width: 40px; height: 4px; border-radius: 2px; background: #4a4d55; }
#drawer { overflow: hidden; display: flex; flex-direction: column; }
#drawer > * { flex: none; }
#drawer.snap { transition: height .3s cubic-bezier(.22,.8,.24,1); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
#controls { padding: 6px 14px 4px; height: 168px; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 6px; overscroll-behavior: contain; }
.hscroll { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; flex: none; }
.hscroll::-webkit-scrollbar { display: none; }
#subtabs { border-top: 1px solid var(--line); padding: 4px 8px; }
.sub { flex: none; padding: 8px 12px; border: 0; background: none; border-radius: 10px; color: var(--muted); font-weight: 500; white-space: nowrap; display: flex; gap: 6px; align-items: center; }
.sub[aria-selected="true"] { color: var(--fg); background: var(--panel-2); }
.sub.auto { color: var(--accent); }
#tools { display: flex; border-top: 1px solid var(--line); padding: 4px; padding-bottom: calc(4px + env(safe-area-inset-bottom, 0px)); }
.tool { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 2px; border: 0; background: none; border-radius: 12px; color: var(--muted); font-size: 11.5px; font-weight: 500; }
.tool[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }

.row { display: flex; flex-direction: column; flex: none; }
.row .head { display: flex; justify-content: space-between; gap: 8px; }
.row label { color: var(--muted); font-size: 13px; }
.row .val { font: 12.5px var(--num); color: var(--muted); font-variant-numeric: tabular-nums; }
.row.ed label { color: var(--fg); } .row.ed .val { color: var(--accent); }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 26px; background: transparent; margin: 0; touch-action: pan-y; }
input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: var(--track, #4a4d55); }
input[type=range]::-moz-range-track { height: 3px; border-radius: 2px; background: var(--track, #4a4d55); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); border: 2px solid var(--ring); margin-top: -9.5px; box-shadow: 0 1px 4px rgba(0,0,0,.5); }
input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); border: 2px solid var(--ring); }

.sws { display: flex; justify-content: space-between; padding: 4px 2px 8px; flex: none; }
.sw { width: 34px; height: 34px; flex: none; border-radius: 50%; padding: 0; background: transparent; border: 2px solid var(--c); display: grid; place-items: center; }
.sw[aria-checked="true"] { background: var(--c); box-shadow: 0 0 0 3px var(--panel), 0 0 0 5px var(--accent); }
.sw[aria-checked="true"]::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #fff; }
.mh { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; flex: none; }
.mh b { color: var(--fg); font-weight: 600; }

.pill { flex: none; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel-2); font-size: 13px; white-space: nowrap; }
.pill[aria-pressed="true"], .pill.sel { border-color: var(--accent); color: var(--accent); }
.btn { height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
.btn:disabled { opacity: .5; }
.rowbtn { display: flex; gap: 8px; flex-wrap: wrap; flex: none; }
.hint { color: var(--muted); font-size: 12.5px; margin: 0; flex: none; }
.seg { display: flex; background: var(--panel-2); border-radius: 10px; padding: 3px; gap: 3px; flex: none; }
.seg button { flex: 1; border: 0; background: none; border-radius: 8px; padding: 7px 8px; color: var(--muted); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--fg); }
.chk { display: flex; align-items: center; gap: 8px; color: var(--fg); font-size: 13.5px; flex: none; }
.chk input { width: 18px; height: 18px; accent-color: var(--accent); }
.thumbs { display: flex; gap: 10px; overflow-x: auto; flex: none; padding: 2px 0 4px; scrollbar-width: none; }
.thumbs::-webkit-scrollbar { display: none; }
.th { flex: none; width: 68px; background: none; border: 0; padding: 0; color: var(--muted); font-size: 11.5px; text-align: center; }
.th img { display: block; width: 68px; height: 68px; object-fit: cover; border-radius: 10px; background: #000; border: 2px solid transparent; margin-bottom: 4px; }
.th[aria-pressed="true"] { color: var(--fg); } .th[aria-pressed="true"] img { border-color: var(--accent); }

.sheet { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
.card { width: 100%; max-width: 520px; background: var(--panel); border: 1px solid var(--line); border-radius: 20px 20px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; max-height: 92%; overflow-y: auto; }
.card h2 { margin: 0; font-size: 17px; display: flex; justify-content: space-between; align-items: center; }
.card select { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; height: 38px; padding: 0 10px; width: 100%; }
.card .pv { max-width: 100%; max-height: 42vh; border-radius: 10px; margin: 0 auto; display: block; -webkit-touch-callout: default; -webkit-user-select: auto; user-select: auto; }
.card .st { color: var(--muted); font-size: 13px; min-height: 18px; }
.prog { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--accent); }
#toast { position: fixed; left: 50%; bottom: 110px; transform: translateX(-50%); background: #2a2c31; border: 1px solid #3a3d44; padding: 9px 14px; border-radius: 12px; font-size: 13px; z-index: 30; max-width: 86%; text-align: center; }

.cgrab { flex: none; height: 28px; margin: -10px -16px -6px; display: grid; place-items: center; touch-action: none; cursor: grab; }
.cgrab i { width: 40px; height: 4px; border-radius: 2px; background: #4a4d55; }
@keyframes sheetup { from { transform: translateY(100%); } }
.card { animation: sheetup .3s cubic-bezier(.22,.8,.24,1); }
@media (min-width: 440px) { .brand { display: block; } }
@media (min-width: 900px) {
  .panel .grab { display: none; }
  .work { flex-direction: row; }
  .panel { width: 380px; flex: none; }
  #controls { flex: 1; height: auto; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand"><b>Estúdio Matiz</b><small id="srcname">Imagem de exemplo</small></div>
    <label class="ib" for="file" title="Abrir foto ou vídeo" aria-label="Abrir foto ou vídeo"><svg class="i" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></label>
    <input id="file" type="file" accept="image/*,video/*" hidden>
    <button class="ib" id="bUndo" aria-label="Desfazer" disabled><svg class="i" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="ib" id="bRedo" aria-label="Refazer" disabled><svg class="i" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <button class="ib" id="bCmp" aria-label="Antes e depois" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 12h18"/></svg></button>
    <button class="ib" id="bReset" aria-label="Redefinir tudo"><svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
    <button class="ib save" id="bSave" aria-label="Salvar"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="m7 11 5 5 5-5"/><path d="M5 20h14"/></svg></button>
  </header>

  <main class="work">
    <section class="left">
      <div class="stage">
        <button class="zoomreset" id="zoomReset" type="button" hidden aria-label="Voltar ao zoom normal"></button>
        <div class="fitbox" id="fitbox">
          <div class="wrap" id="wrap">
            <canvas id="cv" aria-label="Pré-visualização"></canvas>
            <canvas id="ov"></canvas>
            <span class="chip f" id="chipF" hidden></span><span class="chip b" id="chipB">Antes</span><span class="chip a" id="chipA">Depois</span>
            <div class="split" id="split" role="slider" tabindex="0" aria-label="Divisão entre antes e depois" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><i></i></div>
          </div>
        </div>
      </div>
      <div class="vbar" id="vbar" hidden>
        <button type="button" id="play" aria-label="Reproduzir ou pausar"></button>
        <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Posição do vídeo">
        <span class="t" id="time">0:00</span>
      </div>
    </section>
    <section class="panel" aria-label="Ajustes">
      <button class="grab" id="grab" type="button" aria-label="Mostrar ou esconder os controles"><i></i></button>
      <div id="drawer">
        <div id="controls"></div>
        <div class="hscroll" id="subtabs" role="tablist"></div>
      </div>
      <nav id="tools"></nav>
    </section>
  </main>
</div>
<div class="sheet" id="sheet" hidden><div class="card" id="card" role="dialog" aria-modal="true"></div></div>
<div id="toast" hidden></div>
