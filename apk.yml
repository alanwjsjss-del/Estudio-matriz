name: Gerar APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Montar projeto Android
        run: |
          set -e
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "EstudioMatiz"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          EOF
          mkdir -p app
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.matiz.estudio'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.matiz.estudio'
                  minSdk 29
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Estúdio Matiz"
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@style/AppTheme"
                  android:allowBackup="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:statusBarColor">#0f1012</item>
                  <item name="android:navigationBarColor">#0f1012</item>
              </style>
          </resources>
          EOF
          mkdir -p app/src/main/java/com/matiz/estudio
          cat > app/src/main/java/com/matiz/estudio/MainActivity.java <<'EOF'
          package com.matiz.estudio;

          import android.app.Activity;
          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import java.io.OutputStream;

          public class MainActivity extends Activity {
              private WebView web;
              private ValueCallback<Uri[]> chooser;
              private static final int PICK = 71;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  web = new WebView(this);
                  web.setBackgroundColor(Color.parseColor("#0f1012"));
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  web.addJavascriptInterface(new Bridge(), "MatizAndroid");
                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView w, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          if (chooser != null) chooser.onReceiveValue(null);
                          chooser = cb;
                          try {
                              startActivityForResult(p.createIntent(), PICK);
                          } catch (Exception e) {
                              chooser = null;
                              return false;
                          }
                          return true;
                      }
                  });
                  web.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  if (req == PICK && chooser != null) {
                      chooser.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res, data));
                      chooser = null;
                  } else super.onActivityResult(req, res, data);
              }

              @Override
              public void onBackPressed() { finish(); }

              class Bridge {
                  private OutputStream out;
                  private Uri uri;
                  private String name;

                  @JavascriptInterface
                  public void begin(String filename, String mime) throws Exception {
                      close();
                      boolean video = mime != null && mime.startsWith("video");
                      if (mime == null || mime.isEmpty()) mime = video ? "video/webm" : "image/jpeg";
                      name = filename;
                      ContentValues v = new ContentValues();
                      v.put(MediaStore.MediaColumns.DISPLAY_NAME, filename);
                      v.put(MediaStore.MediaColumns.MIME_TYPE, mime);
                      v.put(MediaStore.MediaColumns.RELATIVE_PATH, (video ? Environment.DIRECTORY_MOVIES : Environment.DIRECTORY_PICTURES) + "/EstudioMatiz");
                      v.put(MediaStore.MediaColumns.IS_PENDING, 1);
                      ContentResolver r = getContentResolver();
                      uri = r.insert(video ? MediaStore.Video.Media.EXTERNAL_CONTENT_URI : MediaStore.Images.Media.EXTERNAL_CONTENT_URI, v);
                      out = r.openOutputStream(uri);
                  }

                  @JavascriptInterface
                  public void chunk(String b64) throws Exception {
                      out.write(Base64.decode(b64, Base64.DEFAULT));
                  }

                  @JavascriptInterface
                  public boolean end() {
                      try {
                          out.close(); out = null;
                          ContentValues v = new ContentValues();
                          v.put(MediaStore.MediaColumns.IS_PENDING, 0);
                          getContentResolver().update(uri, v, null, null);
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "Salvo na galeria", Toast.LENGTH_LONG).show());
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  private void close() {
                      try { if (out != null) out.close(); } catch (Exception e) { }
                      out = null;
                  }
              }
          }
          EOF
          mkdir -p app/src/main/assets app/src/main/res/mipmap-xxxhdpi
          cp index.html app/src/main/assets/index.html
          cp icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: Compilar
        run: gradle assembleDebug --no-daemon
      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Estudio Matiz ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
